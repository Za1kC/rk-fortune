<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R&K fortune - 六合彩終極大獎</title>
    <style>
        :root {
            --pink-light: #FFF0F2;
            --pink-main: #F4C2C2;
            --champagne-gold: #F1E5AC;
            --champagne-dark: #D4AF37;
            --text-dark: #5A4A42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
        }

        /* 💻 電腦版與 iPad 的預設背景設定 */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            padding: 20px;
            /* 🟢 修正：確保背景圖正確載入，後面加上漸變色作底色緩衝 */
            background-image: url('k.jpg'); 
            background-size: cover; 
            background-position: center;
            background-color: #FFF0F2; 
        	color: var(--text-dark);
            padding: 20px;

        /* 💻 電腦版與 iPad 的抽獎框設定 */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.64); /* 35% 透明，等你看得清背景圖 */
            backdrop-filter: blur(8px);  
            padding: 80px 25px;     
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3); 
            max-width: 400px;       
            width: 90%;             
            margin-top: 25vh;       /* 沉到偏下方的位置 */
            margin-right: 50px;     /* 電腦版往左挪，露出右邊背景 */
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: var(--text-dark);
            text-shadow: 2px 2px 0px #FFF, 4px 4px 10px rgba(212, 175, 55, 0.3);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #8A7365;
            margin-bottom: 40px;
        }

        .balls-container {
            display: flex;
            justify-content: center;
            gap: 20px;          
            flex-wrap: wrap;        
            min-height: 100px;
            margin-bottom: 50px;    
        }

        .ball {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            color: var(--text-dark);
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15), inset -5px -5px 15px rgba(0,0,0,0.2);
            border: 2px solid #FFF;
            opacity: 0;
            transform: scale(0.3) rotate(-360deg);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ball.show {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* 🎨 六個波波專屬香檳粉粉嫩顏色 */
        .ball:nth-child(1) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #F1E5AC 45%, #D4AF37 100%); color: #5A4A42; } 
        .ball:nth-child(2) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #F4C2C2 45%, #F7E7C4 100%); color: #5A4A42; } 
        .ball:nth-child(3) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #E8C3BA 45%, #F3C4BF 100%); color: #5A4A42; } 
        .ball:nth-child(4) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #F1E5AC 45%, #F1DBC9 100%); color: #5A4A42; } 
        .ball:nth-child(5) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #F4C2C2 45%, #FADDB5 100%); color: #5A4A42; } 
        .ball:nth-child(6) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #E8C3BA 45%, #B76E79 100%); color: #5A4A42; }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, var(--pink-main) 0%, #E8A7A7 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(244, 194, 194, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.4);
            margin: 5px;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { background: #CCC; cursor: not-allowed; box-shadow: none; }

        .role-badge {
            margin-top: 20px;
            font-size: 0.9rem;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.05);
        }

        /* 📱 只有「窄螢幕手機」才會觸發的專屬微調 */
        @media (max-width: 480px) {
            body {
                padding: 10px; 
                /* 🟢 修正：手機版同樣鎖定載入 k.jpg 背景圖 */
                background-image: url('k.jpg'); 
                background-size: 480px 100vh; /* 高度強制100%頂天立地，寬度自動縮放 */
                background-repeat: repeat;
                background-position: center center;
            }
            
            .container {
                margin-right: auto; 
                margin-left: auto;
                margin-top: 5vh;    
                max-width: 340px;   	/*將手機版的寬度從 450px 進一步收窄到 360px */
                padding: 60px 20px; 
                background: rgba(255, 255, 255, 0.3); 
                transform: scale(0.7); 
                transform-origin: center top;
            }
            
            .ball {
                width: 65px;
                height: 65px;
                font-size: 1.6rem;
            }
        }
    </style>

    <!-- 載入 Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMM0JK9gY8zqrNDTokTKjXmAFFK2a9u1E",
            authDomain: "rk-fortune.firebaseapp.com",
            databaseURL: "https://rk-fortune-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rk-fortune",
            storageBucket: "rk-fortune.firebasestorage.app",
            messagingSenderId: "831909000358",
            appId: "1:831909000358:web:cda6893f593171e1ae7067"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'lotteryStatus');

        const luckyNumbers = ["09", "24", "06", "25", "01", "16"];
        let currentCountInDB = 0;
        let isMaster = false;

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const drawBtn = document.getElementById('drawBtn');
            const resetBtn = document.getElementById('resetBtn');
            const statusMessage = document.getElementById('statusMessage');

            if (urlParams.get('mode') === 'master') {
                isMaster = true;
                drawBtn.style.display = 'inline-block';
                resetBtn.style.display = 'inline-block';
                statusMessage.innerText = '🔮 控制端模式 (Master)：您可以控制全場抽獎';
            } else {
                statusMessage.innerText = '📱 觀眾同步模式：已成功連線，等待 Master 抽獎...';
            }

            onValue(statusRef, (snapshot) => {
                const data = snapshot.val();
                currentCountInDB = data ? data.drawnCount : 0;
                updateScreenBalls(currentCountInDB);

                if (isMaster) {
                    if (currentCountInDB >= luckyNumbers.length) {
                        drawBtn.innerText = '🎉 抽獎完成 🎉';
                        drawBtn.disabled = true;
                    } else {
                        drawBtn.innerText = '開出下一個號碼';
                        drawBtn.disabled = false;
                    }
                }
            });
        }

        function updateScreenBalls(count) {
            for (let i = 0; i < luckyNumbers.length; i++) {
                const ball = document.getElementById(`ball-${i}`);
                if (i < count) {
                    ball.innerText = luckyNumbers[i];
                    ball.classList.add('show');
                } else {
                    ball.innerText = '';
                    ball.classList.remove('show');
                }
            }
        }

        window.drawNextBall = function() {
            if (!isMaster) return;
            if (currentCountInDB < luckyNumbers.length) {
                set(statusRef, {
                    drawnCount: currentCountInDB + 1
                });
            }
        }

        window.resetLottery = function() {
            if (!isMaster) return;
            if (confirm("確定要重設抽獎狀態嗎？全場畫面將會清空。")) {
                set(statusRef, {
                    drawnCount: 0
                });
            }
        }

        init();
    </script>
</head>
<body>

    <div class="container">
        <h1>R&K fortune</h1>
        <div class="subtitle">✨ 終極大獎抽獎現場 ✨</div>

        <div class="balls-container" id="ballsContainer">
            <div class="ball" id="ball-0"></div>
            <div class="ball" id="ball-1"></div>
            <div class="ball" id="ball-2"></div>
            <div class="ball" id="ball-3"></div>
            <div class="ball" id="ball-4"></div>
            <div class="ball" id="ball-5"></div>
        </div>

        <button class="btn" id="drawBtn" onclick="drawNextBall()" style="display: none;">開出下一個號碼</button>
        <button class="btn" id="resetBtn" onclick="resetLottery()" style="display: none; background: #A8A8A8;">重設</button>
        
        <br>
        <div id="statusMessage" class="role-badge">正在同步連線...</div>
    </div>

</body>
</html>
