<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R&K fortune - 六合彩終極大獎</title>
    <style>
        :root {
            --pink-light: #FFF0F2;
            --pink-main: #F4C2C2;
            --champagne-gold: #F1E5AC;
            --champagne-dark: #D4AF37;
            --text-dark: #5A4A42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--pink-light) 0%, #F9E7E7 50%, var(--champagne-gold) 100%);
            /* 自訂背景圖（如需要，請取消下一行註解並換檔名） */
            /* background-image: url('fortunebg.JPG'); */
            background-size: cover;
            background-position: center;
            color: var(--text-dark);
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
            border: 2px solid rgba(241, 229, 172, 0.5);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: var(--text-dark);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #8A7365;
            margin-bottom: 40px;
        }

        .balls-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 100px;
            margin-bottom: 40px;
        }

        .ball {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, var(--champagne-gold) 40%, var(--champagne-dark) 100%);
            color: var(--text-dark);
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15), inset -5px -5px 15px rgba(0,0,0,0.2);
            border: 2px solid #FFF;
            opacity: 0;
            transform: scale(0.3) rotate(-360deg);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ball.show {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }


        /* 🟢 六行控制顏色的代碼 🟢 */
        .ball:nth-child(1) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #F1E5AC 45%, #D4AF37 100%); color: #5A4A42; } /* 09號: 香檳金 */
        .ball:nth-child(2) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #F4C2C2 45%, #F7E7C4 100%); color: #5A4A42; } /* 24號: 浪漫粉 */
        .ball:nth-child(3) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #E8C3BA 45%, #F3C4BF 100%); color: #5A4A42; } /* 06號: 玫瑰金 */
        .ball:nth-child(4) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #F1E5AC 45%, #F1DBC9 100%); color: #5A4A42; } /* 25號: 香檳金 */
        .ball:nth-child(5) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #F4C2C2 45%, #FADDB5 100%); color: #5A4A42; } /* 01號: 浪漫粉 */
        .ball:nth-child(6) { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #E8C3BA 45%, #B76E79 100%); color: #5A4A42; } /* 16號: 玫瑰金 */


        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, var(--pink-main) 0%, #E8A7A7 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(244, 194, 194, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.4);
            margin: 5px;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { background: #CCC; cursor: not-allowed; box-shadow: none; }

        .role-badge {
            margin-top: 20px;
            font-size: 0.9rem;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.05);
        }
    </style>

    <!-- 載入 Firebase 核心與即時資料庫 SDK (使用最新且穩定的 v9 模組化版本) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // ⚠️ 請把下面這段替換成你在 Firebase 拿到的專屬設定 ⚠️

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCMM0JK9gY8zqrNDTokTKjXmAFFK2a9u1E",
  authDomain: "rk-fortune.firebaseapp.com",
  databaseURL: "https://rk-fortune-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rk-fortune",
  storageBucket: "rk-fortune.firebasestorage.app",
  messagingSenderId: "831909000358",
  appId: "1:831909000358:web:cda6893f593171e1ae7067"
};

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'lotteryStatus');

        // 指定的終極大獎號碼
        const luckyNumbers = ["09", "24", "06", "25", "01", "16"];
        let currentCountInDB = 0;
        let isMaster = false;

        // 初始化判斷身份
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const drawBtn = document.getElementById('drawBtn');
            const resetBtn = document.getElementById('resetBtn');
            const statusMessage = document.getElementById('statusMessage');

            if (urlParams.get('mode') === 'master') {
                isMaster = true;
                drawBtn.style.display = 'inline-block';
                resetBtn.style.display = 'inline-block';
                statusMessage.innerText = '🔮 控制端模式 (Master)：您可以控制全場抽獎';
            } else {
                statusMessage.innerText = '📱 觀眾同步模式：已成功連線，等待 Master 抽獎...';
            }

            // 【即時同步關鍵】監聽 Firebase 資料庫的數據變動
            onValue(statusRef, (snapshot) => {
                const data = snapshot.val();
                // 如果資料庫沒資料，預設為開了 0 個球
                currentCountInDB = data ? data.drawnCount : 0;
                
                // 根據資料庫的最新進度，更新畫面上顯示的球
                updateScreenBalls(currentCountInDB);

                // 如果是 Master，需要根據進度控制按鈕狀態
                if (isMaster) {
                    if (currentCountInDB >= luckyNumbers.length) {
                        drawBtn.innerText = '🎉 抽獎完成 🎉';
                        drawBtn.disabled = true;
                    } else {
                        drawBtn.innerText = '開出下一個號碼';
                        drawBtn.disabled = false;
                    }
                }
            });
        }

        // 根據數量刷新畫面上的球
        function updateScreenBalls(count) {
            for (let i = 0; i < luckyNumbers.length; i++) {
                const ball = document.getElementById(`ball-${i}`);
                if (i < count) {
                    ball.innerText = luckyNumbers[i];
                    ball.classList.add('show');
                } else {
                    ball.innerText = '';
                    ball.classList.remove('show');
                }
            }
        }

        // Master 點擊按鈕：讓資料庫的號碼開出數量 +1
        window.drawNextBall = function() {
            if (!isMaster) return;
            if (currentCountInDB < luckyNumbers.length) {
                set(statusRef, {
                    drawnCount: currentCountInDB + 1
                });
            }
        }

        // Master 重設按鈕：將抽獎進度清零，全場會一秒內一起清空
        window.resetLottery = function() {
            if (!isMaster) return;
            if (confirm("確定要重設抽獎狀態嗎？全場畫面將會清空。")) {
                set(statusRef, {
                    drawnCount: 0
                });
            }
        }

        // 網頁載入完成後執行
        init();
    </script>
</head>
<body>

    <div class="container">
        <h1>R&K fortune</h1>
        <div class="subtitle">✨ 終極大獎抽獎現場 ✨</div>

        <div class="balls-container" id="ballsContainer">
            <div class="ball" id="ball-0"></div>
            <div class="ball" id="ball-1"></div>
            <div class="ball" id="ball-2"></div>
            <div class="ball" id="ball-3"></div>
            <div class="ball" id="ball-4"></div>
            <div class="ball" id="ball-5"></div>
        </div>

        <!-- Master 控制鍵（預設隱藏） -->
        <button class="btn" id="drawBtn" onclick="drawNextBall()" style="display: none;">開出下一個號碼</button>
        <button class="btn" id="resetBtn" onclick="resetLottery()" style="display: none; background: #A8A8A8;">重設</button>
        
        <br>
        <div id="statusMessage" class="role-badge">正在同步連線...</div>
    </div>

</body>
</html>
